name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano
            shield: roki_left
          - board: nice_nano
            shield: roki_right
    name: Build (${{ matrix.shield }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: Debug workspace
        run: |
          echo "=== workspace ==="
          ls -la
          echo "=== zmk dir ==="
          ls -la zmk/ 2>/dev/null || echo "NO ZMK DIR"
          echo "=== west config ==="
          cat .west/config
      - name: West Zephyr export
        run: west zephyr-export
      - name: West build (${{ matrix.shield }})
        run: west build -s zmk/app -b ${{ matrix.board }} -- -DSHIELD=${{ matrix.shield }}
      - name: Archive (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/zephyr/zmk.uf2
          if-no-files-found: error
      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp build/zephyr/zmk.uf2 artifacts/${{ matrix.shield }}-${{ matrix.board }}.uf2
      - name: Archive named
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}-${{ matrix.board }}
          path: artifacts/${{ matrix.shield }}-${{ matrix.board }}.uf2
          if-no-files-found: error
